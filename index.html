<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / theme -->
    <meta name="theme-color" content="#1a4a7a" />
    <meta name="application-name" content="Scripture Tracker" />
    <meta name="description" content="Daily scripture reading tracker for the standard works of The Church of Jesus Christ of Latter-day Saints." />

    <!-- iOS full-screen PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scriptures" />

    <!-- iOS icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />

    <!-- iOS splash screens (iPhone 14 Pro / common sizes) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Standard icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Android / Chrome install prompt -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Scripture Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
